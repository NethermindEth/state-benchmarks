# Monitoring stack for the geth bloatnet benchmark.
#
# Volume paths to shared assets (prometheus.yml, grafana provisioning,
# textfile_metrics) point at ../../docker/ — docker compose resolves
# relative volume paths from the compose file's directory, and we want a
# single canonical source for those configs across all client templates.

name: benchmark-monitoring

networks:
  default:
    name: benchmark_net

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: benchmark_prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  node_exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:latest}
    container_name: benchmark_node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ../../docker/textfile_metrics:/textfile:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.textfile.directory=/textfile"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${NODE_EXPORTER_PORT:-9100}:9100"
    restart: unless-stopped

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.1}
    container_name: benchmark_cadvisor
    cgroup: host
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /dev:/dev:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    # NOTE: cAdvisor (<= v0.52.x) cannot enrich containers with `name` labels
    # when Docker runs the containerd image store (storage driver "overlayfs"):
    # its docker factory unconditionally reads the legacy layerdb, which that
    # backend doesn't have, so every container fails to register and all
    # name="benchmark_*" queries return nothing. There is no cAdvisor-side
    # workaround; switch the daemon back to the classic store in
    # /etc/docker/daemon.json: {"features": {"containerd-snapshotter": false}}.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${CADVISOR_PORT:-8080}:8080"
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: benchmark_grafana
    depends_on:
      - prometheus
    volumes:
      - ../../docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_DEFAULT_THEME=dark
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/benchmark.json
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
