# Self-contained test stack: Geth in --dev mode + monitoring trio on a shared network.
# Boots in seconds, produces blocks at 1Hz, exposes Prometheus metrics, supports eth_getProof.
# Used to smoke-test the benchmark harness end-to-end (see test-config.yml).
name: benchmark-test

services:
  test-client:
    image: ${GETH_IMAGE:-ethereum/client-go:latest}
    container_name: benchmark_test-client
    volumes:
      - test_client_data:/root/.ethereum
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${CLIENT_RPC_PORT:-8545}:8545"
      - "${BIND_ADDR:-127.0.0.1}:${TEST_CLIENT_METRICS_PORT:-6060}:6060"
    command:
      - --dev
      - --dev.period=1
      - --http
      - --http.addr=0.0.0.0
      - --http.api=eth,net,web3,debug
      - --http.vhosts=*
      - --http.corsdomain=*
      - --metrics
      - --metrics.addr=0.0.0.0
      - --metrics.port=6060
      - --rpc.allow-unprotected-txs
      - --verbosity=2
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: benchmark_prometheus
    # host-gateway makes host.docker.internal resolve to the host on Linux,
    # so Prometheus can scrape the Locust exporter (running on the host as a
    # subprocess of runner.py).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.test.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  node_exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:latest}
    container_name: benchmark_node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # The orchestrator drops benchmark_db_size_bytes here (textfile collector).
      - ./textfile_metrics:/textfile:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.textfile.directory=/textfile'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${NODE_EXPORTER_PORT:-9100}:9100"
    restart: unless-stopped

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.1}
    container_name: benchmark_cadvisor
    # No `privileged: true` — it fails on rootless Docker (OrbStack Linux VM),
    # because the userns-mapped container root can't open host device nodes.
    # `cgroup: host` opts out of the cgroup namespace so cAdvisor can see sibling
    # docker container cgroups (mandatory on rootless; harmless on Docker Desktop).
    # On rootless Docker, cAdvisor's docker factory can't resolve the layer DB
    # (OrbStack uses a custom "overlayfs" storage driver), so it drops the
    # docker scopes entirely. Mounting /dev/null over the socket disables the
    # docker factory and lets the systemd factory expose the cgroups with `id`
    # labels (no `name` enrichment, but the data is there). On Docker Desktop /
    # rootful Linux, leave DOCKER_SOCK unset to get full `name`-enriched series.
    #   Rootless: DOCKER_SOCK=/dev/null docker compose up -d
    cgroup: host
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      # Host /dev so fs stats can stat backing block devices (e.g. /dev/vdb1 on
      # OrbStack/VM hosts) — without it cAdvisor spams btrfs mountpoint warnings.
      - /dev:/dev:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    # See docker-compose.monitoring.yml: on containerd-image-store hosts
    # (storage driver "overlayfs") cAdvisor cannot name-enrich containers;
    # switch the daemon back to the classic store for name="benchmark_*" series.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${CADVISOR_PORT:-8080}:8080"
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: benchmark_grafana
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_DEFAULT_THEME=dark
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/benchmark.json
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  test_client_data:
  prometheus_data:
  grafana_data:
