global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Ethereum Clients
  # Most clients expose Prometheus exposition at /metrics, but geth serves it
  # ONLY at /debug/metrics/prometheus (its /metrics path 404s), so it needs a
  # separate job with the right metrics_path — otherwise up{instance="geth:6060"}
  # stays 0 and every chain_* / gas metric is missing.
  - job_name: 'ethereum_client'
    metrics_path: /metrics
    static_configs:
      - targets: ['nethermind:6060', 'besu:9545', 'reth:9001', 'erigon:6060']

  - job_name: 'ethereum_client_geth'
    metrics_path: /debug/metrics/prometheus
    static_configs:
      - targets: ['geth:6060']
    relabel_configs:
      # Keep the job label 'ethereum_client' so up{job="ethereum_client"} and
      # any job-scoped queries still see geth alongside the other clients.
      - target_label: job
        replacement: ethereum_client

  # Locust runs on the host as a subprocess of runner.py. Both hostnames are
  # listed: host.docker.internal for Docker Desktop, host.orb.internal for
  # OrbStack rootless. Only one is UP at a time.
  - job_name: 'locust'
    static_configs:
      - targets:
          - 'host.docker.internal:9646'
          - 'host.orb.internal:9646'
