# Nethermind mainnet node backed by a pre-synced snapshot on the host's disk.
# Point the orchestrator at this file via infrastructure.compose_paths.clients
# and list "nethermind" in nodes.clients; the runner then starts it with
# `docker compose up -d nethermind` like any other client.
#
# Framework conventions kept so the rest of the pipeline works unchanged:
#   - service name "nethermind"        -> Prometheus scrape target nethermind:6060
#   - container benchmark_nethermind   -> cAdvisor queries + runner's du-based DB sizing
#   - shared benchmark_net network     -> monitoring stack can reach the node
#
# Host paths default to /mnt/bigdata/snapshot_mainnet_neth; override the
# NETHERMIND_* variables in the repo-root .env if the host layout differs.
# Host ports follow the usual BIND_ADDR/CLIENT_*_PORT variables — if another
# node already owns 8545/8551 on the host, set e.g. CLIENT_RPC_PORT=8547 and
# CLIENT_ENGINE_PORT=8552 in .env (and match nodes.rpc_url in the config).
#
# NETHERMIND_IMAGE must match the DB format the snapshot was written with —
# override it in .env if your snapshot came from a different Nethermind build.

name: benchmark-clients

networks:
  default:
    name: benchmark_net

services:
  nethermind:
    image: ${NETHERMIND_IMAGE:-nethermindeth/nethermind:fix-history-pruner-bootstrap}
    container_name: benchmark_nethermind
    tty: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor
    volumes:
      - ${NETHERMIND_DB_PATH:-/mnt/bigdata/snapshot_mainnet_neth/mainnet}:/nethermind/data/nethermind_db/mainnet
      - ${NETHERMIND_CHAINSPEC_PATH:-/mnt/bigdata/snapshot_mainnet_neth/chainspec.json}:/chainspec.json
      - ${NETHERMIND_KEYSTORE_PATH:-/mnt/bigdata/snapshot_mainnet_neth/keystore}:/nethermind/data/keystore
    ports:
      - "${NETHERMIND_P2P_PORT:-30303}:30303/tcp"
      - "${NETHERMIND_P2P_PORT:-30303}:30303/udp"
      - "${BIND_ADDR:-127.0.0.1}:${CLIENT_RPC_PORT:-8545}:8545"
      - "${BIND_ADDR:-127.0.0.1}:${CLIENT_ENGINE_PORT:-8551}:8551"
      - "${BIND_ADDR:-127.0.0.1}:${NETHERMIND_METRICS_PORT:-6060}:6060" # Metrics
    command:
      - --config=mainnet
      - --datadir=/nethermind/data
      - --JsonRpc.Enabled=true
      - --JsonRpc.Host=0.0.0.0
      - --JsonRpc.Port=8545
      - --JsonRpc.EnabledModules=[Eth,Net,Web3,StateComp,Admin,Debug]
      - --JsonRpc.EngineHost=0.0.0.0
      - --JsonRpc.EnginePort=8551
      - --JsonRpc.JwtSecretFile=/nethermind/data/keystore/jwt-secret
      - --Pruning.Mode=None
      - --History.Pruning=Rolling
      - --History.PruningInterval=0
      - --History.RetentionEpochs=82125
      - --Network.MaxActivePeers=0
      - --Network.OnlyStaticPeers=true
      - --Init.DiscoveryEnabled=false
      - --Sync.SnapSync=false
      - --Sync.SnapServingMaxPathsPerGroup=2048
      - --Metrics.Enabled=true
      - --Metrics.ExposePort=6060
      - --log=${NETHERMIND_LOG_LEVEL:-INFO}
